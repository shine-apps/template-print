name: COS check

# 手动校验国内镜像（腾讯云 COS）配置：上传一个小文件 → 匿名下载 / 带 Referer 下载 / Range 校验。
# 用法：Actions → COS check → Run workflow（需已配置 COS_SECRET_ID/KEY/BUCKET/REGION 四个 secrets）。
# 不参与发版流程，只做配置体检。
on:
  workflow_dispatch:

jobs:
  cos-check:
    name: upload tiny file & verify download rules
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check COS secrets are configured
        shell: powershell
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: |
          $missing = @()
          foreach ($k in 'COS_SECRET_ID', 'COS_SECRET_KEY', 'COS_BUCKET', 'COS_REGION') {
            if (-not [Environment]::GetEnvironmentVariable($k)) { $missing += $k }
          }
          if ($missing.Count -gt 0) { throw ('missing repository secrets: ' + ($missing -join ', ')) }
          Write-Host 'COS secrets are configured (values not printed)'

      - name: Write probe file
        shell: powershell
        run: |
          $stamp = (Get-Date).ToUniversalTime().ToString('o')
          Set-Content -Path _cos-check.txt -Value ('template-print COS check at ' + $stamp) -Encoding ascii
          Get-Content _cos-check.txt

      - name: Upload probe file to COS
        shell: powershell
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: ./scripts/upload-to-cos.ps1 -Path '_cos-check.txt'

      - name: Verify download rules (anonymous / Referer / Range)
        shell: powershell
        env:
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: |
          $referer = 'https://dl.templateprint.app/'
          $url = 'https://' + $env:COS_BUCKET + '.cos.' + $env:COS_REGION + '.myqcloud.com/_cos-check.txt'

          function Get-Status {
            param([string]$Uri, [string]$Referer, [switch]$Range)
            $req = [System.Net.HttpWebRequest]::Create($Uri)
            if ($Referer) { $req.Referer = $Referer }
            if ($Range) { [void]$req.AddRange(0, 9) }
            try {
              $resp = $req.GetResponse()
              try {
                return @{ Status = [int]$resp.StatusCode; Length = $resp.ContentLength; ContentRange = [string]$resp.Headers['Content-Range'] }
              } finally { $resp.Close() }
            } catch [System.Net.WebException] {
              $r = $_.Exception.Response
              if ($r) { return @{ Status = [int]$r.StatusCode; Length = $null; ContentRange = '' } }
              return @{ Status = 0; Length = $null; ContentRange = '' }
            }
          }

          $plain = Get-Status -Uri $url
          $signed = Get-Status -Uri $url -Referer $referer
          $ranged = Get-Status -Uri $url -Range

          Write-Host ''
          Write-Host ('object URL          : ' + $url)
          Write-Host ('anonymous GET       : ' + $plain.Status + ' (content-length=' + $plain.Length + ')')
          Write-Host ('GET with Referer    : ' + $signed.Status)
          Write-Host ('anonymous Range 0-9 : ' + $ranged.Status + ' ' + $ranged.ContentRange)
          Write-Host ''

          if ($signed.Status -ne 200) {
            throw 'FAIL: 带 Referer 的下载也被拒绝 -> 桶权限或对象 ACL 有误（客户端会下载失败）'
          }
          if ($plain.Status -eq 200) {
            Write-Host 'RESULT: 匿名可下载 —— 防盗链未开启（当前任何拿到链接的人都能下）'
          } elseif ($plain.Status -eq 403) {
            Write-Host 'RESULT: 匿名 403、带 Referer 200 —— 防盗链已生效，只有本程序能下载（预期终态）'
          } else {
            throw ('FAIL: 匿名请求返回了意外状态码 ' + $plain.Status)
          }
          if ($ranged.Status -eq 200) {
            Write-Host 'NOTE: Range 未生效（返回 200），客户端断点续传会退化为全量重下（功能可用，仅浪费带宽）'
          } elseif ($ranged.Status -eq 206) {
            Write-Host 'NOTE: Range 正常（206），断点续传可用'
          }
