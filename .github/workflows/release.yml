name: Release

# 推送 v* 标签自动发布；也可在 Actions 页手动触发（输入版本号）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不含 v，如 0.2.0）；须已与 package.json / app-info.ts 一致'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: build NSIS & publish GitHub Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve version (tag or manual input)
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $tag = 'v' + $env:INPUT_VERSION
          } else {
            $tag = $env:REF_NAME
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Invalid version tag: $tag (expected vX.Y.Z)"
          }
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          "VERSION=$($tag.Substring(1))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          Write-Host "Publishing $tag"

      - name: Verify versions are consistent
        run: node scripts/release/check-version.mjs $env:VERSION

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npx vitest run

      - name: Build (electron-vite)
        run: npx electron-vite build

      - name: Package NSIS + MSI installers
        run: npx electron-builder --win --publish never

      - name: Extract release notes for this version
        run: node scripts/release/prepare-notes.mjs $env:VERSION

      # ---- Domestic mirror (Tencent COS): optional, enabled by repository secrets ----
      # Configure COS_SECRET_ID / COS_SECRET_KEY / COS_BUCKET / COS_REGION to have the
      # installer and latest.json uploaded to COS, with the manifest "url" pointing at
      # the COS direct link so clients download from inside mainland China.
      - name: Detect COS mirror configuration
        shell: powershell
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
        run: |
          if ($env:COS_SECRET_ID) {
            "COS_ENABLED=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
            Write-Host 'COS mirror enabled'
          } else {
            Write-Host 'COS mirror not configured; manifest will point at the GitHub Release'
          }

      - name: Upload installers to Tencent COS
        id: cos_upload
        # 跨境上传大文件可能失败（GitHub runner -> 国内 COS）；失败不阻断发版，
        # 清单会自动退回 GitHub 直链（见下一个步骤），不会发布指向空地址的清单。
        continue-on-error: true
        if: env.COS_ENABLED == '1'
        shell: powershell
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: |
          # 只镜像客户端真正会下载的文件（清单指向 msi）；exe 仍发布在 GitHub Release。
          ./scripts/upload-to-cos.ps1 -Path "release/TemplatePrint-$env:VERSION-Setup-x64.msi"

      - name: Generate latest.json (size + sha256)
        shell: powershell
        env:
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: |
          $setup = "release/TemplatePrint-$env:VERSION-Setup-x64.msi"
          $mirrored = ($env:COS_ENABLED -eq '1') -and ('${{ steps.cos_upload.outcome }}' -eq 'success')
          if ($mirrored) {
            ./scripts/build-update-manifest.ps1 -SetupPath $setup -AssetBaseUrl "https://$env:COS_BUCKET.cos.$env:COS_REGION.myqcloud.com/"
          } else {
            if ($env:COS_ENABLED -eq '1') { Write-Host '::warning::COS mirror upload failed; manifest falls back to GitHub download URLs' }
            ./scripts/build-update-manifest.ps1 -SetupPath $setup
          }

      - name: Upload latest.json to Tencent COS
        continue-on-error: true
        if: env.COS_ENABLED == '1' && steps.cos_upload.outcome == 'success'
        shell: powershell
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: |
          ./scripts/upload-to-cos.ps1 -Path 'release/latest.json'

      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: 模板打印 ${{ env.TAG }}
          body_path: release/release-notes.txt
          files: |
            release/*Setup*x64.exe
            release/*Setup*x64.msi
            release/latest.json
          fail_on_unmatched_files: true
