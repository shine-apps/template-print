appId: com.local.template-print
productName: TemplatePrint
# 使用 switch-sqlite.ps1 切换的预编译 Electron ABI 二进制，禁止 node-gyp 源码重编译
npmRebuild: false
directories:
  output: release
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/better-sqlite3/**
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
