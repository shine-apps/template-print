appId: com.local.template-print
productName: TemplatePrint
# better-sqlite3 13（N-API）二进制跨 Node/Electron 通用，无需重编译、无需 ABI 切换
npmRebuild: false
directories:
  output: release
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/better-sqlite3/**
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
