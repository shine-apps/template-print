appId: com.local.template-print
productName: TemplatePrint
# 固定产物命名（无空格、含架构），供 latest.json 引用与 GitHub Release 资产匹配
artifactName: ${productName}-${version}-Setup-${arch}.${ext}
# better-sqlite3 13（N-API）二进制跨 Node/Electron 通用，无需重编译、无需 ABI 切换
npmRebuild: false
directories:
  output: release
files:
  - out/**
  - package.json
  # 运行时图标（窗口/任务栏）随包分发
  - resources/**
  # 只交付 Windows x64，排除 better-sqlite3 其余平台的预编译二进制
  - "!node_modules/better-sqlite3/prebuilds/darwin-*.node"
  - "!node_modules/better-sqlite3/prebuilds/linux*.node"
  - "!node_modules/better-sqlite3/prebuilds/win32-arm64.node"
asarUnpack:
  - node_modules/better-sqlite3/prebuilds/win32-x64.node
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
